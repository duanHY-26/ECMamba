[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecmamba"
version = "0.1.0"
description = "ECMamba: gated fusion of protein language model features and MSA-aware selective state-space representations for EC annotation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "ECMamba authors" }
]
dependencies = [
  "torch>=2.1",
  "mamba-ssm>=2.2",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "tqdm>=4.66",
  "h5py>=3.9",
]

[project.scripts]
ecmamba-train-eval = "ecmamba.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
